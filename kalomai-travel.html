<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kalomai Travel · Hoteles disponibles</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" src="/src/kalomai-travel.ts"></script>
  </head>
  <body class="con-sidebar">
    <div id="sidebar-mount"></div>

    <main>
      <section class="kalomai-hero">
        <div class="contenedor">
          <span class="kalomai-hero__eyebrow">✈️ Kalomai Travel</span>
          <h1>Hospédate en hoteles de todo el país</h1>

            Con tu membresía Kalomai Travel accedes a estos hoteles. Consulta

      <section class="seccion">
        <div class="contenedor">
          <div id="grid-hoteles" class="grid-hospedajes"></div>
        </div>
      </section>
    </main>

    <footer class="pie">
      <div class="contenedor">
        <div class="pie__marca">✈️ Kalomai Travel</div>
        <p>Una membresía de Kalomai.</p>
      </div>
